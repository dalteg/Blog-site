{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something went wrong | My Blog</title>

    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>

<!--
    Kept standalone (not extending base.html) so this page still renders
    even if the error comes from the base template itself.
-->
<body>

    <main class="home">

        <section class="hero">
            <div class="hero-inner">
                <p class="eyebrow">500</p>

                <h1>
                    Something went wrong on our end.
                </h1>

                <p class="lede">
                    We're looking into it. Please try again in a moment.
                </p>

                <a class="btn btn-primary" href="/">
                    Back to home
                </a>
            </div>
        </section>

    </main>

</body>

</html>
